# Monta o programa pro Windows (.exe) e pro Mac (.app) e anexa na página de Releases.
# Roda sozinho quando sai uma versão nova (tag v*, ex.: v2.0.0); também dá pra rodar à mão.
name: Construir programas

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arquivo: GeradordePolaroids.exe
          - os: macos-latest
            arquivo: GeradordePolaroids-Mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: python -m pip install -r requirements.txt pyinstaller pymupdf

      - name: Testar o motor (não empacota se falhar)
        run: python testes/rodar.py

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name GeradordePolaroids --icon icone.ico --add-data "icone.ico;." --collect-data cv2 iniciar.pyw

      - name: Empacotar (Mac)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "Gerador de Polaroids" --icon icone.ico --add-data "icone.ico:." --collect-data cv2 --osx-bundle-identifier br.com.printhub.polaroids iniciar.pyw
          cd dist && ditto -c -k --keepParent "Gerador de Polaroids.app" GeradordePolaroids-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arquivo }}
          path: dist/${{ matrix.arquivo }}

      - name: Anexar na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.arquivo }}
